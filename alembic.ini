# ============================================================
# AEAM — Alembic configuration (Phase E5)
#
# Migrations are the SINGLE SCHEMA TRUTH for AEAM (COMPAT-5).
# The startup CREATE-IF-NOT-EXISTS path in
# aeam/integrations/database.py is retained ONLY as a dev-time
# convenience and is labelled as such; production/staging
# schema changes go through `alembic upgrade head`.
#
# The database URL is NOT stored here. migrations/env.py reads
# it from the same Settings/DATABASE_URL the application uses,
# so there is exactly one source of connection truth and no
# credential ever lands in a tracked file (SEC-5).
#
# Usage:
#   alembic upgrade head          # apply all pending migrations
#   alembic downgrade -1          # revert the most recent one
#   alembic current               # show the applied revision
#   alembic history --verbose     # show the full revision graph
# ============================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally omitted — see migrations/env.py.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
