# ============================================================
# AEAM — Deployment environment-variable manifest (Phase E4)
# deploy/env.yaml
#
# This is a REFERENCE document listing every environment variable the
# platform reads, grouped by phase, with the source of truth for each in
# each production posture. It is not consumed by any runtime — actual
# values come from `deploy/cloudrun.yaml` (Cloud Run) or `.env`
# (docker-compose / local dev) — but it is the single canonical list
# operators use when standing up a new environment.
#
# NO literal secret values may appear here or in any other tracked
# deployment file (Phase E4, ARCH-7 / SEC-5). Every credential-typed
# variable below documents WHERE to source it, never its value.
#
# Cross-reference:
#   - `aeam/config/settings.py`     — the authoritative field schema
#   - `deploy/cloudrun.yaml`        — production wiring
#   - `docker-compose.yml`          — local-dev wiring
#   - `.env.example`                — copy-to-.env template for devs
# ============================================================

# --- Datastores (required, all environments) --------------------------
DATABASE_URL:
  description: PostgreSQL DSN. Application reads/writes incidents, audit_logs, etc.
  source: Secret Manager (aeam-database-url) in production; `.env` locally.
  required: true

REDIS_URL:
  description: Redis DSN. Cache, dedup, rate-limit, idempotency, ingestion queue.
  source: Secret Manager (aeam-redis-url); `.env` locally.
  required: true

VECTOR_DB_URL:
  description: Qdrant endpoint for RAG / Enterprise Memory / Policy Registry.
  source: Secret Manager (aeam-vector-db-url); `.env` locally.
  required: true

# --- Posture (required) ------------------------------------------------
ENVIRONMENT:
  description: One of {development, staging, production, test}. Controls the E3 SecurityMiddleware bypass and the SEC-4 fail-closed startup contract.
  required: true

LLM_ENABLED:
  description: Feature flag for LLM-powered stages.
  default: "false"

# --- E7 Autonomous Operations (SEC-8, PHIL-1, OBS-3/4, RAG-6) ---------
ENABLE_MONITOR_AGENT:
  description: Sole, honest gate for the autonomous MonitorAgent polling loop. No environment backdoor — decides in every environment.
  default: "false"
  production_value: "true"

HEARTBEAT_STALE_SECONDS:
  description: Seconds after which a worker's (MonitorAgent/IngestionWorker) last heartbeat is reported "stale" by GET /health, flipping overall status to degraded.
  default: "120"

BM25_STALE_SECONDS:
  description: Informational staleness threshold (seconds) for the BM25 lexical index, disclosed by GET /health. Never affects overall status.
  default: "3600"

# --- E3 Identity & Access (SEC-1..7, ARCH-7) --------------------------
JWT_PUBLIC_KEY:
  description: PEM-encoded RSA public key. Required outside development (fail-closed).
  source: Secret Manager (aeam-jwt-public-key).
  required: production, staging, test

JWT_PUBLIC_KEY_PATH:
  description: Alternative — a filesystem path to a PEM file. Ignored if JWT_PUBLIC_KEY is set.

JWT_ISSUER:
  description: Optional override for the engine-owned default 'aeam-auth'.

JWT_AUDIENCE:
  description: Optional override for the engine-owned default 'aeam-api'.

CORS_ALLOWED_ORIGINS:
  description: Comma-separated frontend origins the CORS middleware admits.
  default: "http://localhost:5173"

AUDIT_LOG_FILE:
  description: File-sink path for the AuditLogger. The durable sink is the audit_logs DB table; the file is best-effort.
  default: "/tmp/audit.log"

# --- E13 Enterprise SSO / OIDC federation (SEC-1/SEC-4) ---------------
# All default to disabled/empty: unset keeps the exact E3 static-key
# posture. Turning OIDC_ENABLED on without OIDC_ISSUER + OIDC_CLIENT_ID
# ABORTS startup in every environment (fail-closed). See
# docs/SECURITY_POSTURE.md for the IdP registration walkthrough.
OIDC_ENABLED:
  description: Master switch for enterprise SSO. False keeps the static-PEM verification posture.
  default: "false"

OIDC_ISSUER:
  description: The IdP's issuer URL. Used for discovery (<issuer>/.well-known/openid-configuration) and as the expected 'iss' claim.
  required: when OIDC_ENABLED=true

OIDC_CLIENT_ID:
  description: Client id the console is registered as at the IdP. Also the expected 'aud' claim.
  required: when OIDC_ENABLED=true

OIDC_CLIENT_SECRET:
  description: Client secret for a CONFIDENTIAL client. Leave empty for the recommended public-client + PKCE posture.
  source: Secret Manager (aeam-oidc-client-secret) if used at all.

OIDC_REDIRECT_URI:
  description: Console callback URL registered at the IdP, e.g. https://aeam.example.com/auth/callback.

OIDC_SCOPES:
  description: Space-separated scopes requested at the authorization endpoint.
  default: "openid profile email"

OIDC_ROLES_CLAIM:
  description: Token claim carrying the caller's AEAM roles ('roles', 'groups', or an IdP-namespaced claim). Values must be members of aeam/security/rbac.py's vocabulary.
  default: "roles"

OIDC_ALGORITHMS:
  description: Comma-separated signature-algorithm allow-list overriding jwt_auth.py's engine-owned default ('RS256'). Empty keeps the default.

OIDC_JWKS_URL:
  description: Explicit JWKS endpoint, bypassing discovery. Empty = read from the discovery document.

OIDC_AUTHORIZATION_ENDPOINT:
  description: Explicit authorization endpoint, bypassing discovery.

OIDC_TOKEN_ENDPOINT:
  description: Explicit token endpoint, bypassing discovery. Pin all three endpoint vars to skip discovery entirely.

OIDC_DISCOVERY_TIMEOUT_SECONDS:
  description: Timeout for the discovery and token-exchange HTTP calls to the IdP.
  default: "5.0"

# --- E13 Tenancy & data classification declaration (Article XVI) ------
# Declarations, not enforcement mechanisms. Surfaced by
# GET /api/v1/system/compliance so the posture the platform reports is
# the posture it is configured with. See docs/ENTERPRISE_CERTIFICATION.md.
TENANCY_MODEL:
  description: "'single-tenant' (the only position AEAM implements — no tenant discriminator exists in any store) or 'multi-tenant'. Any other value is rejected at startup."
  default: "single-tenant"

DATA_CLASSIFICATION:
  description: Highest data classification this deployment's stores are approved to hold (public / internal / confidential / restricted).
  default: "internal"

PII_POSTURE:
  description: "'not-expected' or 'contains-pii'. AEAM performs no automated PII detection; this is a declaration that carries handling obligations."
  default: "not-expected"

# --- E4 Durable BlobStore (ARCH-7 / SEC-5 / TECH-5) -------------------
BLOB_STORAGE_BACKEND:
  description: "'local' (LocalDiskBlobStore) or 's3' (S3BlobStore, any S3-compatible endpoint)."
  default: "local"
  production_value: "s3"

BLOB_STORAGE_DIR:
  description: Root directory for LocalDiskBlobStore.
  default: "data/blobs"

BLOB_S3_BUCKET:
  description: S3 bucket name. Required when BLOB_STORAGE_BACKEND=s3.
  source: Secret Manager (aeam-blob-bucket) in production.

BLOB_S3_ENDPOINT_URL:
  description: Custom S3 endpoint for MinIO / R2 / GCS-via-HMAC. Empty → AWS default.

BLOB_S3_REGION:
  description: AWS region for endpoint resolution.
  source: Secret Manager (aeam-blob-region) in production.

BLOB_S3_ACCESS_KEY_ID:
  description: S3 access key. OMIT to fall back to boto3's default provider chain (workload identity / IAM role — the recommended posture).

BLOB_S3_SECRET_ACCESS_KEY:
  description: S3 secret key. OMIT together with BLOB_S3_ACCESS_KEY_ID.

BLOB_S3_PREFIX:
  description: Key prefix inside the bucket (e.g. 'aeam/prod').

# --- E4 Durable model artifacts (ARCH-7) ------------------------------
FORECAST_MODEL_DIR:
  description: Directory where trained Prophet artifacts persist. On ephemeral compute (Cloud Run) this MUST point at a durable mount (Cloud Storage FUSE).
  default: "models/forecasting"
  production_value: "/models"

# --- E4 Config persistence honesty (PHIL-1) ---------------------------
CONFIG_PERSISTENCE_MODE:
  description: "'durable' when D5 admin-API writes survive instance recycle; 'ephemeral' when they do not (Cloud Run's writable layer)."
  default: "durable"
  production_value: "ephemeral"

CONFIG_PERSISTENCE_NOTE:
  description: Free-text operator-facing message shown alongside CONFIG_PERSISTENCE_MODE in the admin API response.

# --- Optional integrations --------------------------------------------
SLACK_BOT_TOKEN:      { description: Slack OAuth token, source: Secret Manager }
SLACK_CHANNEL:        { description: Default Slack channel, default: "#aeam-alerts" }
JIRA_URL:             { description: Jira Cloud URL }
JIRA_API_TOKEN:       { description: Jira API token, source: Secret Manager }
JIRA_USER_EMAIL:      { description: Jira user email }
JIRA_PROJECT_KEY:     { description: Jira project key }
JIRA_ISSUE_TYPE:      { description: Jira issue type }
GOOGLE_SHEETS_SA_CREDENTIALS: { description: Minified GCP service-account JSON, source: Secret Manager }
SHEET_ID:             { description: Google Sheet ID }
SHEET_RANGE:          { description: Google Sheet range, default: "Sheet1!A2:C10" }

# --- E8 AI Governance (AI-1..AI-7) --------------------------------------
LLM_PROVIDER:         { description: "LLM backend id. 'groq' is the ONLY implemented provider — anything else aborts startup when LLM_ENABLED=true and USE_MOCK_LLM=false.", default: groq }
LLM_API_KEY:          { description: LLM API key, source: Secret Manager }
USE_MOCK_LLM:         { description: "When true, LLM calls return a mock response instead of reaching a real provider. See docs/ai_governance.md's environment posture table.", default: "true" }
LLM_TIMEOUT_SECONDS:  { description: "Per-call timeout (seconds) enforced at the shared LLMService client, covering all six call sites.", default: "30" }
LLM_COST_PER_1K_PROMPT_TOKENS_USD:     { description: "USD per 1k prompt tokens, used by the llm_cost_usd_total metric. Honest zero until configured.", default: "0.0" }
LLM_COST_PER_1K_COMPLETION_TOKENS_USD: { description: "USD per 1k completion tokens. Same honesty contract.", default: "0.0" }

# --- E9 Human-in-the-Loop Enforcement (AGENT-5, SEC-7, COMPAT-1/5/6) ----
# Deliberately absent from the D5 admin config registry: an approval gate a
# single API call can switch off is not a governance control, so changing
# these is a deployment-time act recorded here. See docs/human_in_the_loop.md.
HUMAN_APPROVAL_ENFORCED:
  description: "When true, gated runbook steps are withheld until the incident's approval chain is satisfied. False restores pre-E9 advisory behaviour exactly (documented rollback); the tables stay and go inert."
  default: "true"

APPROVAL_TIER_CHAIN:
  description: "Default ordered approval chain, comma-separated. One entry (the default) is a single-tier requirement, behaviourally identical to a one-step approval."
  default: reviewer

APPROVAL_TIER_CHAIN_OVERRIDES:
  description: "Optional per-severity chains, formatted 'SEVERITY:tier1,tier2;SEVERITY2:tier1'. A policy that names responsible roles takes precedence over this."
  default: ""

# --- F1 Detection & forecast intelligence (PHIL-1, COMPAT-2, TECH-6) ----
# Every detection change ships flag-gated with Phase-5 behaviour as the
# default, so an unset deployment runs the pre-F1 pipeline byte-for-byte.
# KPI_AGENT_ENABLED is the one exception and defaults ON: it replaces a
# placeholder F1 DELETED, so defaulting it off would leave the
# investigation loop with no KPI pass at all.
KPI_AGENT_ENABLED:
  description: "Enables the real KPIAgent investigation pass. False does NOT restore the pre-F1 placeholder (it was deleted, not bypassed) — it disables the KPI pass entirely. See the F1 rollback strategy in ROADMAP.md."
  default: "true"

KPI_AGENT_HISTORY_LIMIT:
  description: Maximum historical observations the KPIAgent fetches per investigation.
  default: "90"

DETECTION_CHANGEPOINT_ENABLED:
  description: "Enables ChangepointDetector (sustained level shifts the rolling window absorbs). False leaves signals, severity and event metadata byte-identical to Phase 5."
  default: "false"

DETECTION_CHANGEPOINT_THRESHOLD:
  description: Robust-sigma score above which a level shift is reported.
  default: "3.0"

DETECTION_CHANGEPOINT_MIN_SEGMENT:
  description: Minimum observations either side of a candidate changepoint.
  default: "4"

DETECTION_SEASONAL_HYBRID_ENABLED:
  description: "Enables SeasonalHybridDetector (values wrong for their phase, which a flat rolling mean cannot see). False leaves Phase-5 behaviour unchanged."
  default: "false"

DETECTION_SEASONAL_PERIOD:
  description: "Seasonal cycle length in observations (7 = weekly on daily data). Also deseasonalizes the changepoint detector — without it a weekly metric reports a spurious level shift on every weekend."
  default: "7"

DETECTION_SEASONAL_MIN_CYCLES:
  description: Complete cycles required before the seasonal detector emits any score.
  default: "3"

DETECTION_SEASONAL_THRESHOLD:
  description: Robust-sigma score above which a seasonal residual is an anomaly.
  default: "3.0"

FORECAST_BACKTEST_ENABLED:
  description: "TECH-6: backtest a newly trained forecast model on a holdout BEFORE it is allowed to serve, and record its MAPE. False preserves Phase-5 train-and-serve exactly."
  default: "false"

FORECAST_BACKTEST_HOLDOUT:
  description: Trailing observations withheld from training and used as the backtest horizon.
  default: "7"

FORECAST_MAX_HOLDOUT_MAPE:
  description: "Holdout MAPE (percent) above which a newly trained model is REFUSED and the metric reports insufficient data rather than serving unvalidated predictions. 0.0 means 'record the score but never refuse'."
  default: "0.0"

FORECAST_MODEL_SELECTION_ENABLED:
  description: "When true (with FORECAST_BACKTEST_ENABLED), candidate models are backtested and the lowest-MAPE candidate serves."
  default: "false"

# --- F2 Adaptive learning & confidence recalibration --------------------
# Closes the feedback loop: E9 human verdicts and resolved outcomes become
# labeled signal, a calibration mapping is fitted from them, and stated
# confidence is post-processed so a "0.8" means what it says.
#
# OFF by default. Turning it on changes what `confidence` MEANS on a
# finalized incident, which is a decision an operator makes deliberately
# after reviewing a recalibration's measured improvement
# (POST /api/v1/learning/recalibrate with dry_run=true), never a default.
# Raw confidence is always retained in audit_summary.calibration.
LEARNING_CALIBRATION_ENABLED:
  description: "When true, the active calibration is applied to confidence at finalize and BOTH values are disclosed. False (the default) reports raw confidence exactly as F1 did — the documented F2 rollback."
  default: "false"

LEARNING_HISTORY_LIMIT:
  description: Maximum incidents the Learning Agent reads per recalibration run.
  default: "5000"

LEARNING_MIN_TRAINING_SAMPLES:
  description: "Labeled samples required before a calibration is fitted at all. Below this, isotonic regression reproduces the training set and generalises to nothing, so the engine refuses."
  default: "60"

LEARNING_HOLDOUT_FRACTION:
  description: "Fraction of labeled samples withheld from the fit and used to measure improvement. Every reported ECE gain is measured on data the mapping never saw."
  default: "0.3"

LEARNING_MIN_ECE_IMPROVEMENT:
  description: "Minimum held-out ECE reduction that counts as learning rather than noise. A fit below this is reported as not improved and is NOT adopted (PHIL-1)."
  default: "0.01"

# --- F4 Correlation Intelligence & Business Graph ---------------------
# The business graph relates metrics, datasets, services, policies and
# incidents through typed, weighted edges — every one of them derived from
# evidence the platform already holds (dataset profiles, policy
# related_metrics, incident history, and the cross-dataset correlations C4
# already measured). It is an ADVISORY evidence source: it appends a
# 'graph' finding and never overrides RuleEngine, StatisticalDetector,
# KPIAgent, or ForecastAgent.
#
# OFF by default, and inert even when on until an operator runs a build
# (POST /api/v1/graph/build). The graph never mutates itself and is never
# rebuilt as a side effect of an investigation.
BUSINESS_GRAPH_ENABLED:
  description: "When true, the Orchestrator appends a 'graph' advisory finding and CrossDatasetAnalyzer consults known relationships. False (the default) restores pairwise Phase C4 correlation exactly — the documented F4 rollback."
  default: "false"

GRAPH_MAX_DEPTH:
  description: "Maximum traversal hops from the incident's metric. Hard-capped at 5 in code regardless of this value."
  default: "2"

GRAPH_MAX_NODES:
  description: "Maximum distinct nodes one traversal may visit. Reaching it truncates the answer, and the finding discloses that it was truncated."
  default: "100"

GRAPH_MAX_EDGES:
  description: "Maximum edges one traversal may read across all hops — the cost bound that keeps a hub node from turning an investigation into a full table scan."
  default: "300"

GRAPH_MIN_EDGE_CONFIDENCE:
  description: "Edges below this confidence are not traversed. Zero traverses every persisted edge (all of which are already evidence-grounded)."
  default: "0.0"

GRAPH_BUILD_INCIDENT_LIMIT:
  description: "Maximum incidents one graph build reads, most recent first. Bounds the build the same way LEARNING_HISTORY_LIMIT bounds a recalibration."
  default: "5000"

GRAPH_MIN_CORRELATION:
  description: "Minimum |Pearson r| a persisted cross-dataset observation must show before it becomes a 'correlates_with' edge. Defaults to C4's own reporting threshold."
  default: "0.7"

# --- F7 Enterprise Connector Framework ---------------------------------
# Eight connectors feeding the EXISTING ingestion pipeline (documents) and the
# EXISTING CompositeKPISource (metrics). No second ingestion, indexing,
# embedding, retrieval, or detection path.
#
# Every connector is independently gated and ALL default off, so a deployment
# that sets none of these behaves exactly as it did before F7: manual upload
# plus the existing Google Sheets KPI connector, unchanged. That is the
# documented rollback — the framework is inert with no connectors enabled.
#
# Credentials NEVER appear here. Each connector's sources.secret_ref names an
# environment variable (or a future secret-manager key) that SecretManager
# resolves at sync time; only the NAME is ever configuration.
CONNECTORS_ENABLED:
  description: "Master switch. False (the default) disables every connector regardless of its own flag, restoring the exact pre-F7 upload + Sheets posture in one setting."
  default: "false"

CONNECTOR_MOCK_MODE:
  description: "When true, every connector uses the deterministic in-repo mock client instead of a real upstream — lets an operator watch a full sync (listing, change detection, ingestion, retrieval) before any credential exists. Connector health reports mock_mode=true so a mock sync is never mistaken for a tenant one."
  default: "false"

CONNECTOR_SHAREPOINT_ENABLED:
  description: "Enable the SharePoint document connector (Microsoft Graph). Requires sources.config site_url + drive_id."
  default: "false"

CONNECTOR_CONFLUENCE_ENABLED:
  description: "Enable the Confluence document connector. Requires sources.config base_url + space_key."
  default: "false"

CONNECTOR_GITHUB_ENABLED:
  description: "Enable the GitHub document connector (github.com or Enterprise). Requires sources.config repository + path."
  default: "false"

CONNECTOR_GOOGLE_WORKSPACE_ENABLED:
  description: "Enable the Google Workspace (Drive) DOCUMENT connector. Independent of the existing Google Sheets KPI connector, which this phase leaves unchanged. Requires sources.config folder_id."
  default: "false"

CONNECTOR_SAP_ENABLED:
  description: "Enable the SAP metric connector. Requires sources.config host + client + query, and the pyrfc SDK (not a platform dependency — an absent SDK is reported as not authenticated, never as zero rows)."
  default: "false"

CONNECTOR_SALESFORCE_ENABLED:
  description: "Enable the Salesforce metric connector. Requires sources.config instance_url + soql."
  default: "false"

CONNECTOR_SNOWFLAKE_ENABLED:
  description: "Enable the Snowflake metric connector. Requires sources.config account + warehouse + database + query."
  default: "false"

CONNECTOR_BIGQUERY_ENABLED:
  description: "Enable the BigQuery metric connector. Requires sources.config project_id + dataset + query."
  default: "false"

CONNECTOR_SYNC_MAX_ARTIFACTS:
  description: "Maximum artifacts one sync run processes. A bound, not a preference: an unbounded first sync against a very large library would hold a request open and flood the ingestion queue. Hitting it is reported as truncated and the next run continues from the advanced cursor."
  default: "500"

CONNECTOR_STALE_AFTER_SECONDS:
  description: "Age past which a connector's last successful sync is reported stale. A connector that has NEVER synced reports stale=null with a reason rather than false — unknown freshness is never reported as fresh."
  default: "86400"

# --- F6 Agent Mesh Formalization ---------------------------------------
# Two roles the enterprise architecture names but the mesh left implicit:
# whole-mesh oversight, and execution planning as a first-class agent.
#
# Both default ON, unlike the F1-F4 intelligence flags, because neither can
# change an outcome: PlanningAgent forwards to the SAME C7 engine and
# returns its result unmodified, and SupervisorAgent only reads telemetry.
# Flag-off is the documented rollback — the roster entries disappear and the
# C7 engine becomes the direct planning path again.
PLANNING_AGENT_ENABLED:
  description: "When true, the C7 ExecutionPlanningEngine is wrapped by PlanningAgent — a named roster member with its own heartbeat, metric label, and span. Planning output is byte-identical either way."
  default: "true"

SUPERVISOR_AGENT_ENABLED:
  description: "When true, SupervisorAgent is constructed and GET /api/v1/mesh/health reports mesh health and behaviour anomalies from existing E7 heartbeats, E11 metrics, and roster participation. Advisory only — it never coordinates, executes, or restarts anything (ARCH-1)."
  default: "true"

# --- D4 Configurable engine thresholds --------------------------------
# See aeam/config/settings.py for the exhaustive list. All default to
# the engine-owned constants; leave unset unless an operator explicitly
# tunes them via the D5 admin UI (or, in production, this manifest).
