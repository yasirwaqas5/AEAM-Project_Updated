# ============================================================
# AEAM — Google Cloud Run Deployment Manifest
# deploy/cloudrun.yaml
#
# Single-container modular monolith deployment on ephemeral compute.
# Deploy with:
#   gcloud run services replace deploy/cloudrun.yaml --region REGION
#
# Phase E4 (ARCH-7 / SEC-5 / TECH-5) state-placement contract:
#   * BlobStore    -> S3-compatible bucket (BLOB_STORAGE_BACKEND=s3)
#                     because Cloud Run's local disk is ephemeral.
#   * ForecastAgent models -> Cloud Storage FUSE mount or a co-located
#                     bucket in front of a persistent /models path.
#   * Audit trail  -> audit_logs table (Phase E3); no file dependency.
#   * .env writes  -> disclosed via CONFIG_PERSISTENCE_MODE=ephemeral
#                     (Phase E4, PHIL-1) — the D5 admin UI shows the
#                     honest posture; use env-var overrides here for
#                     durable production changes.
#
# Single-writer components (documented per ARCH-7):
#   MonitorAgent, IngestionWorker.
# maxScale=5 is safe only because both are guarded by:
#   * Redis-shared deduplication + idempotency (multi-instance safe).
#   * Per-incident IncidentContext (Phase E2 ARCH-8 — the Orchestrator
#     itself is reentrant across concurrent handlers).
#
# NO credential literals in this file. Every secret is sourced from
# Google Secret Manager via secretKeyRef; the shipped repo never
# contains a real key.
# ============================================================

apiVersion: serving.knative.dev/v1
kind: Service

metadata:
  name: aeam-monolith
  labels:
    app: aeam
    layer: monolith
  annotations:
    # HTTPS-only — reject all plain HTTP traffic.
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all

spec:
  template:
    metadata:
      annotations:
        # Auto-scaling bounds. See "Single-writer components" note above.
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"

        # CPU is always allocated (not throttled between requests).
        run.googleapis.com/cpu-throttling: "false"

        # Phase E4: use gen2 so the container gets a proper Linux
        # runtime for boto3 / Cloud Storage FUSE mounts.
        run.googleapis.com/execution-environment: gen2

    spec:
      # Request timeout — allow long investigations.
      timeoutSeconds: 300

      containers:
        - image: gcr.io/PROJECT_ID/aeam:latest
          name: aeam

          ports:
            - name: http1
              containerPort: 8080

          resources:
            limits:
              cpu: "2"
              memory: 4Gi

          env:
            # ---------- Datastores (SEC-5: all via Secret Manager) ----------
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aeam-database-url
                  key: latest

            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aeam-redis-url
                  key: latest

            - name: VECTOR_DB_URL
              valueFrom:
                secretKeyRef:
                  name: aeam-vector-db-url
                  key: latest

            # ---------- Posture ----------
            - name: ENVIRONMENT
              value: "production"

            - name: LLM_ENABLED
              value: "false"

            - name: MONITOR_INTERVAL_SECONDS
              value: "300"

            - name: MAX_INVESTIGATION_DEPTH
              value: "5"

            # ---------- Phase E7 (SEC-8, PHIL-1) — autonomous operations ----------
            # The sole, honest gate for the autonomous MonitorAgent polling
            # loop — no environment backdoor exists in the application code
            # any more, so this value is the ONLY thing deciding whether
            # production actually runs the "24/7 autonomous platform" this
            # product claims to be (audit gate #4). Flip to "false" only for
            # a deliberately trigger-only deployment.
            - name: ENABLE_MONITOR_AGENT
              value: "true"

            # Heartbeat staleness threshold — several multiples of
            # MONITOR_INTERVAL_SECONDS above so a normal sleep between
            # cycles is never mistaken for a dead thread (see Settings
            # docstring). 900s = 3x the 300s interval above.
            - name: HEARTBEAT_STALE_SECONDS
              value: "900"

            # ---------- Phase E3 (SEC-1..7, ARCH-7) — identity & audit ----------
            # SEC-4 fail-closed: startup aborts if these are unset in a
            # non-development environment.
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: aeam-jwt-public-key
                  key: latest

            # Optional overrides for the engine-owned defaults.
            # - name: JWT_ISSUER
            #   value: "aeam-auth"
            # - name: JWT_AUDIENCE
            #   value: "aeam-api"

            - name: CORS_ALLOWED_ORIGINS
              # Comma-separated origins. Update to the production
              # console origin (e.g. https://aeam.example.com).
              value: "https://aeam.example.com"

            - name: AUDIT_LOG_FILE
              # File sink is best-effort on ephemeral compute; the
              # durable sink is the audit_logs table (Phase E3).
              value: "/tmp/audit.log"

            # ---------- Phase E4 (ARCH-7) — durable BlobStore ----------
            - name: BLOB_STORAGE_BACKEND
              value: "s3"

            - name: BLOB_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: aeam-blob-bucket
                  key: latest

            # Optional — leave unset to use the AWS regional endpoint.
            # Set this for MinIO / R2 / GCS-via-HMAC.
            # - name: BLOB_S3_ENDPOINT_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: aeam-blob-endpoint-url
            #       key: latest

            - name: BLOB_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: aeam-blob-region
                  key: latest

            # Credentials — omit both to fall back to the workload
            # identity / IAM role the Cloud Run service runs as
            # (the recommended posture — no long-lived keys).
            # - name: BLOB_S3_ACCESS_KEY_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: aeam-blob-access-key-id
            #       key: latest
            # - name: BLOB_S3_SECRET_ACCESS_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: aeam-blob-secret-access-key
            #       key: latest

            - name: BLOB_S3_PREFIX
              value: "aeam/prod"

            # ---------- Phase E4 (ARCH-7) — durable model artifacts ----------
            # Cloud Run mounts a Cloud Storage FUSE volume at /models
            # via the run.googleapis.com/volume-mounts annotation
            # (configured out-of-band by the operator's Terraform).
            - name: FORECAST_MODEL_DIR
              value: "/models"

            # ---------- Phase E4 (PHIL-1) — config persistence honesty ----------
            # Cloud Run's writable layer is ephemeral. .env writes made
            # via the D5 admin API succeed locally but are lost on
            # instance recycle — surface that to the operator.
            - name: CONFIG_PERSISTENCE_MODE
              value: "ephemeral"

            - name: CONFIG_PERSISTENCE_NOTE
              value: >-
                Writes via the admin API are LOCAL to the current instance
                and do NOT survive recycle on Cloud Run. For durable
                production changes, edit deploy/cloudrun.yaml and
                redeploy.

            # ---------- Phase E8 (AI-1..AI-7) — AI governance ----------
            # 'groq' is the only implemented provider (see
            # docs/ai_governance.md). Since LLM_ENABLED is "false" above,
            # this has no runtime effect yet — declared explicitly so
            # turning LLM_ENABLED on later does not silently fall back to
            # the unimplemented pre-E8 default ("gemini").
            - name: LLM_PROVIDER
              value: "groq"

            # Explicit even though it matches the Settings default (true) —
            # documents the deliberate choice: a real key + LLM_ENABLED=true
            # + USE_MOCK_LLM=false are all THREE required together before
            # this deployment would ever call a real model (LLMService's
            # provider-truth check aborts startup otherwise).
            - name: USE_MOCK_LLM
              value: "true"

            - name: LLM_TIMEOUT_SECONDS
              value: "30"

            # Cost rates: left at the honest zero default. An operator
            # who wants llm_cost_usd_total to reflect a real number sets
            # these to their negotiated per-1k-token price.
            # - name: LLM_COST_PER_1K_PROMPT_TOKENS_USD
            #   value: "0.05"
            # - name: LLM_COST_PER_1K_COMPLETION_TOKENS_USD
            #   value: "0.08"

            # ---------- Phase E9 (AGENT-5) — human-in-the-loop ----------
            # C7's human_approval_required is ENFORCED here, not advisory:
            # an incident that requires approval has its gated runbook steps
            # withheld until an authorized reviewer approves through
            # /api/v1/review. Slack/Jira/email always dispatch regardless —
            # informing humans is never gated. Setting this to "false" is
            # the documented rollback to pre-E9 advisory behaviour and
            # should be a deliberate, recorded decision.
            - name: HUMAN_APPROVAL_ENFORCED
              value: "true"

            # Default ordered chain. One tier = today's single-step
            # approval. Set several (or use the per-severity overrides
            # below) to require analyst → manager → risk in order.
            - name: APPROVAL_TIER_CHAIN
              value: "reviewer"

            # Per-severity chains — uncomment to require more signatures on
            # the incidents that warrant them. A matched policy naming
            # responsible roles takes precedence over this.
            # - name: APPROVAL_TIER_CHAIN_OVERRIDES
            #   value: "CRITICAL:analyst,manager,risk;HIGH:analyst,manager"

          # Liveness probe — restart container if /health fails.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10

          # Startup probe — allow extra time for model loading.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 10

  # Route 100% of traffic to the latest revision.
  traffic:
    - percent: 100
      latestRevision: true
